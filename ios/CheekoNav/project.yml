# Generate the Xcode project with: xcodegen   (brew install xcodegen)
name: CheekoNav
options:
  bundleIdPrefix: com.diypet
  deploymentTarget:
    iOS: "17.0"
targets:
  CheekoNav:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Cheeko Nav
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, bluetooth-central]
        NSBluetoothAlwaysUsageDescription: Cheeko Nav connects to your Cheeko over Bluetooth to show navigation on it.
        NSLocationWhenInUseUsageDescription: Cheeko Nav sends your position to the Cheeko so it can show where you are.
        NSLocationAlwaysAndWhenInUseUsageDescription: Cheeko Nav keeps sending your position to the Cheeko while your phone is locked during a ride.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diypet.cheekonav
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 45252W47RR  # Personal Team (free): reinstall every 7 days
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "1"
